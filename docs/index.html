<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>World Time Zone Converter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>World Time Zone Converter</h1>
            <p class="site-description">Built to coordinate meetings across LATAM and the US — pick a time and instantly see what it means for everyone on the team.</p>

            <div class="header-section">
                <div id="currentInfo" class="current-info">
                    <p>
                        <strong>Your timezone:</strong>
                        <span id="userTimezone">Detecting...</span>
                    </p>
                    <p>
                        <strong>Current date and time:</strong>
                        <span id="currentDateTime">Loading...</span>
                    </p>
                </div>
                <div class="controls-section">
                    <button
                        id="themeToggle"
                        class="theme-toggle"
                        title="Toggle dark mode"
                    >
                        <span class="theme-icon">🌙</span>
                    </button>
                    <div class="date-section">
                        <label for="dateInput" class="date-label">Date</label>
                        <input id="dateInput" type="date" class="date-input" />
                    </div>
                </div>
            </div>

            <div class="timezone-converter">
                <div class="timezone-grid">
                    <!-- Cards rendered dynamically by script.js -->
                </div>

                <div class="grid-footer">
                    <button id="addTimezoneBtn" class="btn-add-timezone">
                        <span class="btn-add-icon">+</span>
                        Add Timezone
                    </button>
                </div>

                <div class="status-message" id="statusMessage">
                    Loading conversions...
                </div>
            </div>
        </div>

        <!-- Add Timezone Modal -->
        <div id="tzModal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Add Timezone">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title">Add Timezone</h2>
                    <button id="modalClose" class="modal-close" aria-label="Close">×</button>
                </div>
                <input
                    id="modalSearch"
                    type="text"
                    class="modal-search"
                    placeholder="Search country or city..."
                    autocomplete="off"
                />
                <div id="modalList" class="modal-list"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
